name: Backend

on:
  push:
    paths:
      [
        "services/**",
        "infra/**",
        ".github/**",
        "docs/**",
        "README.md",
        "CONTRIBUTING.md",
      ]
  pull_request:
    paths:
      [
        "services/**",
        "infra/**",
        ".github/**",
        "docs/**",
        "README.md",
        "CONTRIBUTING.md",
      ]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit --prod --audit-level=high

  images:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build service image
        working-directory: services
        run: docker build --file ${{ matrix.service }}/Dockerfile --target runtime --tag retcon-${{ matrix.service }}:ci .
