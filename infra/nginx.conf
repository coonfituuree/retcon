worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  map $upstream_http_x_request_id $retcon_request_id {
    '' $request_id;
    default $upstream_http_x_request_id;
  }
  log_format retcon escape=json '{"service":"gateway","requestId":"$retcon_request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout retcon;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 256k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;
    location = /health { access_log off; return 200 'ok'; }
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
      limit_req zone=login burst=10 nodelay;
      set $auth http://auth:3001;
      proxy_pass $auth;
    }
    location /api/v1/auth/ {
      limit_req zone=api burst=40 nodelay;
      set $auth http://auth:3001;
      proxy_pass $auth;
    }
    location / { return 404; }
  }
}
